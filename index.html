<!DOCTYPE html>
<html lang="id">
<link rel="stylesheet" href="style.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MerchVerse - Toko Merchandise</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #1e293b;
    }

    header {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      padding: 50px 8%;
    }

    header h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    header p {
      max-width: 700px;
      line-height: 1.8;
      color: #cbd5e1;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 24px;
      padding: 30px 8%;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    input,
    select,
    button {
      border-radius: 14px;
      border: 1px solid #dbe2ea;
      padding: 12px 14px;
      font-size: 14px;
    }

    input {
      min-width: 260px;
    }

    button {
      background: #111827;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background: #374151;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .card-content {
      padding: 18px;
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .card h3 {
      margin-bottom: 8px;
    }

    .price {
      font-size: 24px;
      font-weight: 800;
      margin: 14px 0;
    }

    .stock {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .cart {
      background: white;
      border-radius: 24px;
      padding: 20px;
      height: fit-content;
      position: sticky;
      top: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .cart-item {
      border-bottom: 1px solid #e2e8f0;
      padding: 14px 0;
    }

    .cart-item h4 {
      margin-bottom: 6px;
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .qty button {
      padding: 6px 10px;
      border-radius: 10px;
    }

    .summary {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #e2e8f0;
    }

    .summary div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
    }

    .checkout {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      font-size: 15px;
    }

    @media(max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 34px;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>MerchVerse</h1>
  <p>
    Toko merchandise modern dengan katalog produk, pencarian, filter kategori,
    keranjang belanja, dan checkout sederhana.
  </p>
</header>

<div class="container">

  <section>
    <h2 style="margin-bottom: 20px;">Katalog Produk</h2>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Cari merchandise..." onkeyup="renderProducts()">

      <select id="categoryFilter" onchange="renderProducts()">
        <option value="Semua">Semua</option>
        <option value="Kaos">Kaos</option>
        <option value="Hoodie">Hoodie</option>
        <option value="Topi">Topi</option>
        <option value="Aksesoris">Aksesoris</option>
      </select>
    </div>

    <div class="products" id="productList"></div>
  </section>

  <aside class="cart">
    <h2>Keranjang</h2>

    <div id="cartList"></div>

    <div class="summary">
      <div>
        <span>Subtotal</span>
        <span id="subtotal">Rp0</span>
      </div>

      <div>
        <span>Ongkir</span>
        <span id="shipping">Gratis</span>
      </div>

      <div class="total">
        <span>Total</span>
        <span id="total">Rp0</span>
      </div>
    </div>

    <button class="checkout" onclick="checkout()">
      Checkout Pesanan
    </button>
  </aside>

</div>

<script>
  const products = [
    {
      id: 1,
      name: 'Kaos Logo Premium',
      category: 'Kaos',
      price: 125000,
      stock: 24,
      image: 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=80'
    },
    {
      id: 2,
      name: 'Hoodie Oversized',
      category: 'Hoodie',
      price: 285000,
      stock: 12,
      image: 'https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=900&q=80'
    },
    {
      id: 3,
      name: 'Tote Bag Canvas',
      category: 'Aksesoris',
      price: 89000,
      stock: 38,
      image: 'https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=900&q=80'
    },
    {
      id: 4,
      name: 'Topi Dad Hat',
      category: 'Topi',
      price: 99000,
      stock: 18,
      image: 'https://images.unsplash.com/photo-1521369909029-2afed882baee?auto=format&fit=crop&w=900&q=80'
    },
    {
      id: 5,
      name: 'Stiker Pack',
      category: 'Aksesoris',
      price: 35000,
      stock: 60,
      image: 'https://images.unsplash.com/photo-1618005198919-d3d4b5a92ead?auto=format&fit=crop&w=900&q=80'
    },
    {
      id: 6,
      name: 'Lanyard Custom',
      category: 'Aksesoris',
      price: 45000,
      stock: 44,
      image: 'https://images.unsplash.com/photo-1563906267088-b029e7101114?auto=format&fit=crop&w=900&q=80'
    }
  ];

  let cart = [];

  function rupiah(number) {
    return new Intl.NumberFormat('id-ID', {
      style: 'currency',
      currency: 'IDR',
      maximumFractionDigits: 0
    }).format(number);
  }

  function renderProducts() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const category = document.getElementById('categoryFilter').value;

    const filtered = products.filter(product => {
      const matchSearch = product.name.toLowerCase().includes(search);
      const matchCategory = category === 'Semua' || product.category === category;
      return matchSearch && matchCategory;
    });

    const productList = document.getElementById('productList');

    if(filtered.length === 0) {
      productList.innerHTML = '<p>Produk tidak ditemukan.</p>';
      return;
    }

    productList.innerHTML = filtered.map(product => `
      <div class="card">
        <img src="${product.image}" alt="${product.name}">

        <div class="card-content">
          <span class="badge">${product.category}</span>

          <h3>${product.name}</h3>

          <div class="price">${rupiah(product.price)}</div>

          <div class="stock">Stok tersedia: ${product.stock}</div>

          <button onclick="addToCart(${product.id})">
            Tambah ke Keranjang
          </button>
        </div>
      </div>
    `).join('');
  }

  function addToCart(id) {
    const product = products.find(item => item.id === id);
    const existing = cart.find(item => item.id === id);

    if(existing) {
      existing.qty++;
    } else {
      cart.push({ ...product, qty: 1 });
    }

    renderCart();
  }

  function changeQty(id, value) {
    const item = cart.find(item => item.id === id);

    if(!item) return;

    item.qty += value;

    if(item.qty <= 0) {
      cart = cart.filter(cartItem => cartItem.id !== id);
    }

    renderCart();
  }

  function removeItem(id) {
    cart = cart.filter(item => item.id !== id);
    renderCart();
  }

  function renderCart() {
    const cartList = document.getElementById('cartList');

    if(cart.length === 0) {
      cartList.innerHTML = '<p>Keranjang masih kosong.</p>';
    } else {
      cartList.innerHTML = cart.map(item => `
        <div class="cart-item">
          <h4>${item.name}</h4>

          <div>${rupiah(item.price)} x ${item.qty}</div>

          <div class="qty">
            <button onclick="changeQty(${item.id}, -1)">-</button>
            <strong>${item.qty}</strong>
            <button onclick="changeQty(${item.id}, 1)">+</button>
            <button onclick="removeItem(${item.id})">Hapus</button>
          </div>
        </div>
      `).join('');
    }

    const subtotal = cart.reduce((sum, item) => {
      return sum + (item.price * item.qty);
    }, 0);

    const shipping = subtotal > 250000 || subtotal === 0 ? 0 : 18000;
    const total = subtotal + shipping;

    document.getElementById('subtotal').innerText = rupiah(subtotal);
    document.getElementById('shipping').innerText = shipping === 0 ? 'Gratis' : rupiah(shipping);
    document.getElementById('total').innerText = rupiah(total);
  }

  function checkout() {
    if(cart.length === 0) {
      alert('Keranjang masih kosong.');
      return;
    }

    alert('Pesanan berhasil dibuat.');

    cart = [];
    renderCart();
  }

  renderProducts();
<script src="script.js"></script>

</body>
</html>
